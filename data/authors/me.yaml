experience:
  - role: Graduate Research Assistant — Robotic Manipulation & Control
    org: Oregon State University
    start: 2021-12-01
    summary: |
      Engineered a comprehensive learning pipeline for complex robotic manipulation utilizing simulation design, reinforcement learning, and synthetic data generation. Formulated a novel hybrid RL method integrating suboptimal expert data, outperforming naive PPO and Imitation Learning baselines by a statistically significant 6%. Trained and deployed a visual servoing policy for a UR5 using Deep RL (PPO), achieving >50% success in unstructured physical environments. Improved target fruit detection accuracy by 27% (96% success rate) using SAM2 and a custom YOLO model. Deployed policies via ROS2 and MoveIt!, reducing experimentation time by 80% via Behavior Trees.
    button:
      text: View resume
      url: /uploads/resume_1.pdf
      icon: hero/arrow-down-tray
  - role: Robotics Engineer Intern
    org: AgRobotics
    start: 2025-06-01
    end: 2025-09-30
    summary: |
      Developed scalable robotic simulation pipelines utilizing NVIDIA Isaac Sim and Isaac Lab for autonomous agricultural systems.
  - role: Engineer
    org: Samsung Research Institute, Bangalore
    start: 2021-01-01
    end: 2021-08-31
    summary: |
      Developed network solutions on the 5G NR MAC team. Increased test coverage metric from 2.1 to 3.2 (exceeding required threshold of 3.0) using the Google Test framework. Earned the Software Professional Certification for proficiency in Data Structures and Algorithms.
  - role: Research Intern
    org: RBCCPS LAB, Indian Institute of Science (IISc)
    start: 2020-07-01
    end: 2021-01-31
    summary: |
      Adapted state-of-the-art Image Inpainting models in PyTorch to Dynamic to Static LiDAR Reconstruction. Evaluated reconstruction quality by executing SLAM on reconstructed LiDAR output using ROS. Formulated the "LiDAR Quality Index" metric to rank LiDAR frame quality without reference ground truth.
  - role: President
    org: Robotics Grad Student Association, OSU
    start: 2023-01-01
    end: 2024-12-31
    summary: |
      Directed the student organization for the 2023-2024 academic year, coordinating events and advocating for graduate students.

